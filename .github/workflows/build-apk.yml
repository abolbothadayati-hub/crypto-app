name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm deps
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p 4 $UNSIGNED aligned.apk
          $BT/apksigner sign \
            --ks $RUNNER_TEMP/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out sahmyekom-release.apk aligned.apk
          $BT/apksigner verify sahmyekom-release.apk
          rm -f $RUNNER_TEMP/release.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sahmyekom-release-apk
          path: sahmyekom-release.apk
